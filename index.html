<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F5F2">
<title>迷人秀 · 对标视频</title>
<style>
  :root{
    --paper:#F2F5F2;
    --paper-2:#E7EDE8;
    --glass:rgba(255,255,255,.74);
    --glass-line:rgba(255,255,255,.92);
    --ink:#1C2420;
    --ink-2:#55615A;
    --ink-3:#656F6A;
    --line:#C9D2CC;
    --accent:#3E5C4A;
    --accent-d:#2A4436;
    --accent-l:#5E826D;
    --accent-soft:#E3ECE6;
    --warm:#E08A4B;
    --hot:#C4452C;
    --glow:rgba(var(--acc-rgb),.11);
    --glow-2:rgba(224,138,75,.075);
    --bar-bg:rgba(242,245,242,.76);
    --ring:rgba(var(--acc-rgb),.55);
    --media:#0E0B09;
    --on-media:#FFFFFF;
    --veil-btn:rgba(255,255,255,.94);

    /* 把所有阴影/描边里的写死色收口成 RGB 变量，换主题时一处改全站跟着变 */
    --sh-rgb:28,36,32;
    --pill-rgb:43,68,55;
    --acc-rgb:62,92,74;
    --hot-rgb:196,69,44;
    --bar-line:rgba(201,210,204,.72);
    --glass-solid:#FFFFFF;
    --tag-bg:rgba(42,68,54,.88);
    /* 切换器轨道 + 药丸：默认绿色，教学视图整组换成暖棕 */
    --seg-l:#4E7059;
    --seg-d:#2B4437;
    --seg-t1:rgba(var(--acc-rgb),.075);
    --seg-t2:rgba(var(--acc-rgb),.125);
    --seg-bd:rgba(var(--acc-rgb),.10);

    --t-hero:32px; --t-h2:19px; --t-card:17px;
    --t-body:16px; --t-sub:13.5px; --t-tag:12px;
    --r-lg:18px; --r-md:11px; --r-sm:7px;
    --sp-block:30px; --sp-card:14px; --sp-el:6px;

    /* beUI / Apple 弹簧：按压回弹、指示器滑动、面板 morph、交叉溶解 */
    --spring:cubic-bezier(.34,1.56,.64,1);
    --slide:cubic-bezier(.22,1,.36,1);
    --morph:cubic-bezier(.32,1.25,.4,1);
  }


  /* ============ 教学视图：整套暖色主题 ============ */
  body[data-theme="warm"]{
    --paper:#FAF5EE;
    --paper-2:#F1E7DA;
    --glass:rgba(255,252,247,.76);
    --glass-line:rgba(255,255,255,.94);
    --glass-solid:#FFFDF9;
    --ink:#2A2118;
    --ink-2:#63554A;
    --ink-3:#6E6157;
    --line:#DCCBB6;
    --accent:#96612F;
    --accent-d:#7A4B27;
    --accent-l:#C08B57;
    --accent-soft:#F4E7D6;
    --warm:#D9703F;
    --hot:#B5502E;
    --glow:rgba(150,97,47,.14);
    --glow-2:rgba(217,112,63,.09);
    --bar-bg:rgba(250,245,238,.80);
    --ring:rgba(150,97,47,.55);
    --media:#17120D;
    /* 压深一档：白字在药丸浅端仍有 4.8:1，暖得清楚而不是发灰 */
    --seg-l:#99673C;
    --seg-d:#7A4B27;
    --seg-t1:rgba(var(--acc-rgb),.10);
    --seg-t2:rgba(var(--acc-rgb),.17);
    --seg-bd:rgba(var(--acc-rgb),.14);
    --sh-rgb:42,32,24;
    --pill-rgb:122,75,39;
    --acc-rgb:150,97,47;
    --hot-rgb:181,80,46;
    --bar-line:rgba(220,203,182,.78);
    --tag-bg:rgba(122,75,39,.88);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;overflow-x:clip}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(760px 420px at 12% -10%,var(--glow),transparent 66%),
      radial-gradient(620px 380px at 100% 100%,var(--glow-2),transparent 70%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:-webkit-flex;display:flex;
    -webkit-flex-direction:column;flex-direction:column;
    min-height:100vh;
    transition:background-color .45s ease;
  }

  /* 玻璃面：半透明 + 模糊 + 白边 + 内高光 + 大而软的投影 */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);
    backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid var(--glass-line);
    box-shadow:0 2px 6px rgba(var(--sh-rgb),.04),0 14px 38px rgba(var(--sh-rgb),.075),inset 0 1px 0 rgba(255,255,255,.95);
  }
  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    .glass{background:var(--glass-solid)}
  }

  /* ============ 顶部玻璃条 ============ */
  .bar{
    position:-webkit-sticky;position:sticky;top:0;z-index:40;
    background:var(--bar-bg);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--bar-line);
    animation:barIn .6s var(--slide) both;
  }
  .bar-in{
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;gap:10px;
    max-width:720px;margin:0 auto;padding:11px 15px;
  }
  .brand{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:9px;min-width:0}
  /* 小屏别让放大后的切换器把品牌名挤没 */
  @media(max-width:374px){
    .seg a{font-size:14px;padding:9px 12px}
    .brand b{font-size:14px}
  }
  .brand .mark{
    width:30px;height:30px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(145deg,var(--accent-l) 0%,var(--accent) 45%,var(--accent-d) 100%);
    box-shadow:0 4px 12px rgba(var(--pill-rgb),.28),inset 0 1px 0 rgba(255,255,255,.32);
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;
    transition:transform .3s var(--spring);
  }
  .bar:active .brand .mark{transform:scale(.9)}
  .brand .mark svg{width:16px;height:16px}
  .brand .txt{min-width:0}
  .brand b{display:block;font-size:var(--t-body);font-weight:700;line-height:1.15}
  .brand i{display:block;font-size:var(--t-tag);font-weight:400;font-style:normal;color:var(--ink-3);line-height:1.35}

  /* 切换器：深绿药丸会滑动，不是瞬间换色 */
  .seg{
    position:relative;margin-left:auto;flex-shrink:0;
    display:-webkit-flex;display:flex;
    background:linear-gradient(180deg,var(--seg-t1),var(--seg-t2));
    border:1px solid var(--seg-bd);
    border-radius:14px;padding:4px;gap:3px;
    box-shadow:inset 0 1px 3px rgba(var(--sh-rgb),.10);
  }
  .pill{
    position:absolute;top:4px;left:4px;height:calc(100% - 8px);
    border-radius:11px;z-index:0;
    background:linear-gradient(160deg,var(--seg-l) 0%,var(--seg-d) 100%);
    box-shadow:0 3px 10px rgba(var(--pill-rgb),.44),inset 0 1px 0 rgba(255,255,255,.20);
    transition:transform .32s var(--slide),width .32s var(--slide);
  }
  .seg a{
    position:relative;z-index:1;
    font-size:var(--t-body);font-weight:800;text-decoration:none;
    color:var(--ink-2);padding:9px 17px;border-radius:11px;
    white-space:nowrap;cursor:pointer;
    transition:color .26s ease;
  }
  .seg a.on{color:var(--on-media)}

  .wrap{max-width:720px;margin:0 auto;padding:0 15px 40px;-webkit-flex:1;flex:1;width:100%}

  /* ============ 视图切换动画 ============ */
  .view{display:none}
  .view.show{display:block}
  .view.leaving{animation:viewOut .14s ease-in both;pointer-events:none}
  .view.in-right{animation:viewInRight .36s var(--slide) both}
  .view.in-left{animation:viewInLeft .36s var(--slide) both}
  @-webkit-keyframes viewOut{to{opacity:0;-webkit-filter:blur(5px);filter:blur(5px);-webkit-transform:translateX(-20px);transform:translateX(-20px)}}
  @keyframes viewOut{to{opacity:0;filter:blur(5px);transform:translateX(-20px)}}
  @-webkit-keyframes viewInRight{from{opacity:0;-webkit-filter:blur(7px);filter:blur(7px);-webkit-transform:translateX(30px);transform:translateX(30px)}to{opacity:1;-webkit-filter:blur(0);filter:blur(0);-webkit-transform:none;transform:none}}
  @keyframes viewInRight{from{opacity:0;filter:blur(7px);transform:translateX(30px)}to{opacity:1;filter:blur(0);transform:none}}
  @-webkit-keyframes viewInLeft{from{opacity:0;-webkit-filter:blur(7px);filter:blur(7px);-webkit-transform:translateX(-30px);transform:translateX(-30px)}to{opacity:1;-webkit-filter:blur(0);filter:blur(0);-webkit-transform:none;transform:none}}
  @keyframes viewInLeft{from{opacity:0;filter:blur(7px);transform:translateX(-30px)}to{opacity:1;filter:blur(0);transform:none}}

  @keyframes barIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:none}}
  @keyframes sheen{0%{transform:translateX(-130%);opacity:0}28%{opacity:1}100%{transform:translateX(130%);opacity:0}}
  @keyframes pressPop{0%{transform:scale(1)}38%{transform:scale(.955)}100%{transform:scale(1)}}
  @keyframes tagPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes playingGlow{0%,100%{box-shadow:0 0 0 2px var(--ring)}50%{box-shadow:0 0 0 4px rgba(var(--acc-rgb),.32),0 14px 34px rgba(var(--acc-rgb),.20)}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ hero ============ */
  .hero{padding:var(--sp-block) 2px 20px}
  .hero h1{
    font-size:var(--t-hero);font-weight:800;letter-spacing:-.9px;line-height:1.1;
    color:var(--accent);overflow-wrap:break-word;min-width:0;
    animation:riseIn .58s var(--slide) both;
  }
  .hero .stat{
    margin-top:13px;
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    -webkit-flex-wrap:wrap;flex-wrap:wrap;gap:10px;
    font-size:var(--t-sub);color:var(--ink-2);
    animation:riseIn .58s var(--slide) .09s both;
  }
  .hero .stat > span:first-child{margin-right:6px}
  .hero .stat b{color:var(--ink);font-size:var(--t-body);font-weight:800;font-variant-numeric:tabular-nums}
  .upd{
    display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:5px;
    color:var(--accent-d);background:var(--accent-soft);
    padding:5px 11px;border-radius:999px;
    font-size:var(--t-sub);font-weight:700;
    box-shadow:0 3px 10px rgba(var(--acc-rgb),.10),inset 0 1px 0 rgba(255,255,255,.8);
  }
  .upd .pulse{
    width:6px;height:6px;border-radius:50%;background:var(--warm);
    animation:tagPulse 2.2s ease-in-out infinite;
  }

  /* ============ 分类卡：玻璃 + 点击高光 + 弹簧按压 ============ */
  .cats{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:11px}
  .cat{
    position:relative;overflow:hidden;
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;gap:13px;
    padding:var(--sp-card);border-radius:var(--r-lg);
    cursor:pointer;
    transition:transform .3s var(--spring),box-shadow .3s ease,border-color .3s ease;
    animation:cardIn .52s var(--slide) both;
    animation-delay:calc(var(--i,0) * 62ms);
  }
  .cat::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.82) 50%,transparent 68%);
    transform:translateX(-130%);opacity:0;
  }
  .cat.pressed::after{animation:sheen .55s ease-out}
  .cat.pressed{animation:pressPop .32s var(--spring)}
  .cat:active{transform:scale(.968)}
  @media(hover:hover) and (pointer:fine){
    .cat:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(var(--sh-rgb),.06),0 22px 50px rgba(var(--sh-rgb),.11),inset 0 1px 0 rgba(255,255,255,.95)}
    .cat:hover .cat-thumb{transform:scale(1.05)}
    .cat:hover .cat-go{transform:translateX(3px)}
  }
  .cat-thumb{
    width:66px;height:88px;border-radius:var(--r-md);flex-shrink:0;
    -o-object-fit:cover;object-fit:cover;
    background:var(--paper-2);border:1px solid var(--line);display:block;
    box-shadow:0 3px 10px rgba(var(--sh-rgb),.10);
    transition:transform .4s var(--slide);
  }
  .cat-main{-webkit-flex:1;flex:1;min-width:0}
  .cat-title{
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    -webkit-flex-wrap:wrap;flex-wrap:wrap;gap:6px;
  }
  .cat-title h2{
    font-size:var(--t-card);font-weight:800;line-height:1.3;
    overflow-wrap:break-word;min-width:0;
  }
  .cat-badge{
    font-size:var(--t-tag);font-weight:800;color:var(--on-media);
    background:linear-gradient(140deg,var(--accent),var(--accent-d));
    padding:3px 7px;border-radius:var(--r-sm);flex-shrink:0;
    box-shadow:0 2px 6px rgba(var(--pill-rgb),.24);
  }
  .cat-new{
    font-size:var(--t-tag);font-weight:800;color:var(--on-media);
    background:var(--hot);padding:3px 7px;border-radius:var(--r-sm);flex-shrink:0;
    box-shadow:0 2px 6px rgba(var(--hot-rgb),.22);
  }
  .cat-sub{font-size:var(--t-sub);color:var(--ink-3);margin-top:var(--sp-el)}
  .cat-sub b{color:var(--ink-2);font-weight:700}
  .cat-go{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;
    color:var(--accent);background:var(--accent-soft);
    transition:transform .3s var(--spring),background .3s ease,color .3s ease;
  }

  /* ============ 分类内页 ============ */
  .back{
    display:-webkit-inline-flex;display:inline-flex;
    -webkit-align-items:center;align-items:center;gap:5px;
    font-size:var(--t-body);font-weight:700;color:var(--accent-d);
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--glass-line);
    border-radius:999px;padding:10px 15px;min-height:44px;
    margin:14px 0 14px;cursor:pointer;font-family:inherit;
    box-shadow:0 3px 12px rgba(var(--sh-rgb),.07),inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .28s var(--spring),box-shadow .28s ease;
  }
  .back:active{transform:scale(.93)}
  @media(hover:hover) and (pointer:fine){
    .back:hover{box-shadow:0 6px 18px rgba(var(--sh-rgb),.12),inset 0 1px 0 rgba(255,255,255,.9)}
  }
  .sec-head{
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    gap:8px;padding:0 2px 14px;
    animation:riseIn .5s var(--slide) both;
  }
  .sec-head h2{font-size:var(--t-h2);font-weight:800;letter-spacing:-.4px;overflow-wrap:break-word;min-width:0}
  .sec-head .badge{
    font-size:var(--t-tag);font-weight:800;color:var(--on-media);
    background:linear-gradient(140deg,var(--accent),var(--accent-d));
    padding:3px 7px;border-radius:var(--r-sm);
  }
  .sec-head .cnt{margin-left:auto;font-size:var(--t-sub);color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:700}

  .grid{
    display:-webkit-flex;display:flex;
    -webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -5px;
  }
  .cellwrap{width:50%;padding:0 5px 16px}
  @media(min-width:600px){ .cellwrap{width:33.3333%} }
  @media(min-width:880px){ .cellwrap{width:25%} }

  .cell{
    position:relative;width:100%;padding-bottom:177.78%;
    background:var(--media);border-radius:var(--r-lg);
    box-shadow:0 3px 9px rgba(var(--sh-rgb),.08),0 16px 34px rgba(var(--sh-rgb),.12);
    transition:box-shadow .3s ease,transform .3s var(--spring);
    animation:cardIn .5s var(--slide) both;
    animation-delay:calc(var(--i,0) * 40ms);
  }
  .cell:active{transform:scale(.97)}
  video{
    position:absolute;top:0;left:0;width:100%;height:100%;display:block;
    background:var(--media);border-radius:var(--r-lg);
    -o-object-fit:contain;object-fit:contain;
    -webkit-transform:translateZ(0);transform:translateZ(0);
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
  }
  .cell.busy{box-shadow:0 0 0 2px var(--ring),0 10px 26px rgba(var(--sh-rgb),.14)}
  .cell.playing{animation:playingGlow 2.4s ease-in-out infinite}
  .cell .spin{
    position:absolute;left:50%;top:50%;width:30px;height:30px;
    margin:-15px 0 0 -15px;border-radius:50%;z-index:3;
    border:2.5px solid rgba(255,255,255,.22);border-top-color:#fff;
    -webkit-animation:spin .8s linear infinite;animation:spin .8s linear infinite;
    display:none;pointer-events:none;
  }
  .cell.busy .spin{display:block}
  .new-tag{
    position:absolute;top:8px;left:8px;z-index:5;
    display:inline-block;font-size:var(--t-tag);font-weight:800;line-height:1;
    color:var(--on-media);padding:4px 7px;background:var(--hot);
    border-radius:var(--r-sm) var(--r-sm) var(--r-sm) 2px;
    box-shadow:0 3px 9px rgba(var(--hot-rgb),.30);
    pointer-events:none;animation:tagPulse 2.6s ease-in-out infinite;
  }
  /* 置顶：不用红色，跟「新」区分开；深色底在浅深封面上都压得住 */
  .new-tag.pin-tag{
    background:linear-gradient(140deg,var(--accent) 0%,var(--accent-d) 100%);
    box-shadow:0 2px 9px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.20);
    animation:none;
  }

  /* 播放遮罩：点一下缩放淡出，播放键放大消散 */
  .veil{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;
    border-radius:var(--r-lg);
    background:linear-gradient(180deg,rgba(10,7,4,.10) 0%,rgba(10,7,4,0) 32%,rgba(10,7,4,0) 62%,rgba(10,7,4,.20) 100%);
    cursor:pointer;
    transition:opacity .34s ease,visibility .34s ease,transform .34s var(--slide);
  }
  .veil .play{
    width:54px;height:54px;border-radius:50%;background:var(--veil-btn);
    box-shadow:0 6px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9);
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;
    transition:transform .34s var(--spring),opacity .3s ease;
  }
  .veil .play svg{width:20px;height:20px;fill:var(--accent-d);margin-left:2px}
  .veil:active .play{transform:scale(.88)}
  .veil.off{opacity:0;visibility:hidden;transform:scale(1.12)}
  .veil.off .play{transform:scale(1.8);opacity:0}

  .author{
    display:-webkit-flex;display:flex;
    -webkit-align-items:baseline;align-items:baseline;gap:4px;
    padding:8px 2px 0;
    font-size:var(--t-sub);line-height:1.35;color:var(--ink);font-weight:700;
    -webkit-user-select:text;user-select:text;word-break:break-all;
  }
  .author .lb{flex-shrink:0;font-size:var(--t-tag);font-weight:400;color:var(--ink-3)}

  /* ============ 教学网格：和对标视频页同一套两列竖版形式 ============ */
  .tmeta{padding:8px 2px 0}
  .ttitle{
    font-size:var(--t-sub);line-height:1.35;color:var(--ink);font-weight:700;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    overflow-wrap:break-word;min-width:0;
  }
  .tmeta-foot{
    margin-top:6px;
    display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;gap:6px;
  }
  .tdur-s{
    display:-webkit-inline-flex;display:inline-flex;
    -webkit-align-items:center;align-items:center;
    background:var(--accent-soft);color:var(--accent-d);
    padding:2px 7px;border-radius:var(--r-sm);
    font-size:var(--t-tag);font-weight:800;font-variant-numeric:tabular-nums;
  }
  .tcue{font-size:var(--t-tag);color:var(--ink-3);font-weight:400}

  /* 序号角标，替代对标页的「新」 */
  .tno-tag{
    position:absolute;top:8px;left:8px;z-index:6;
    font-size:var(--t-tag);font-weight:800;line-height:1;
    color:var(--on-media);padding:4px 7px;
    background:var(--tag-bg);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.24);
    border-radius:var(--r-sm);
    pointer-events:none;
  }

  /* 教学封面是 9:20，比格子的 9:16 更修长。
     独立成 img 用 cover 铺满；video 先藏起来，点了才淡入，
     播放时 contain 保证横屏录屏不被裁掉内容。 */
  .tposter{
    position:absolute;top:0;left:0;width:100%;height:100%;
    -o-object-fit:cover;object-fit:cover;
    border-radius:var(--r-lg);
    background:var(--paper-2);
    z-index:1;
    transition:opacity .34s ease,transform .5s var(--slide);
  }
  .tcell .tposter.hidden-img{opacity:0;transform:scale(1.07)}
  .tcell video{z-index:2;opacity:0;transition:opacity .32s ease}
  .tcell.on video{opacity:1}
  .tcell .veil{z-index:4}
  .tcell .tno-tag{z-index:6}

  footer{
    text-align:center;font-size:var(--t-tag);color:var(--ink-3);
    padding:var(--sp-block) 16px 40px;
    border-top:1px solid var(--line);margin-top:10px;
  }
  footer .icp{margin-top:8px;font-size:var(--t-tag)}
  footer .icp a{color:var(--ink-3);text-decoration:none;border-bottom:1px dotted var(--line)}

  a:focus-visible,button:focus-visible,video:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm);
  }
  /* 系统开了减弱动态：所有动效停掉，内容直接可见 */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      -webkit-animation-duration:.001ms !important;animation-duration:.001ms !important;
      -webkit-animation-iteration-count:1 !important;animation-iteration-count:1 !important;
      -webkit-transition-duration:.001ms !important;transition-duration:.001ms !important;
    }
    .veil.off,.veil.off .play{opacity:0}
  }
  .hidden{display:none !important}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5h16M4 12h11M4 18.5h7"/>
        </svg>
      </span>
      <span class="txt"><b>迷人秀</b><i>内部素材库</i></span>
    </div>
    <nav class="seg" id="seg">
      <span class="pill" id="pill"></span>
      <a id="tabCats" class="on" data-view="cats">对标视频</a>
      <a id="tabTeach" data-view="teach">教学</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <!-- ========== 视图 1：分类 ========== -->
  <section class="view show" id="viewCats">
    <div class="hero">
      <h1>对标视频</h1>
      <div class="stat">
        <span><b id="total">0</b> 条素材</span>
        <span>看完照着拍</span>
        <span class="upd" id="updBox" style="display:none">
          <span class="pulse"></span><span id="updText"></span>
        </span>
      </div>
    </div>
    <div id="cats" class="cats"></div>
  </section>

  <!-- ========== 视图 2：视频列表 ========== -->
  <section class="view" id="viewVideos">
    <button class="back" id="backBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      全部分类
    </button>
    <div class="sec-head">
      <h2 id="secLabel"></h2>
      <span class="badge" id="secBadge"></span>
      <span class="cnt" id="secCnt"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ========== 视图 3：教学 ========== -->
  <section class="view" id="viewTeach">
    <div class="hero">
      <h1>视频教学</h1>
      <div class="stat">
        <span><b id="teachTotal">0</b> 节课</span>
        <span>点封面就能播，边看边操作</span>
      </div>
    </div>
    <div id="tgrid" class="grid"></div>
  </section>

</div>

<footer>
  <div>内部对标素材，请勿外传</div>
  <div class="icp"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">豫ICP备XXXXXXXX号-1</a></div>
</footer>

<script src="data.js"></script>
<script src="teach-data.js"></script>
<script>
(function () {
  "use strict";
  var BATCHES = window.BATCHES || [];
  var TEACH   = window.TEACH || [];
  var bySlug = {}, total = 0;

  BATCHES.forEach(function (b) { total += b.count; bySlug[b.slug] = b; });
  document.getElementById("total").textContent = total;
  document.getElementById("teachTotal").textContent = TEACH.length;

  /* ---------- 顶部更新提示 ---------- */
  var NEW_COUNT = window.NEW_COUNT || 0;
  if (NEW_COUNT > 0) {
    var d = window.UPDATED || "";
    var short = d.length === 10 ? d.slice(5).replace("-", "月") + "日" : d;
    document.getElementById("updText").textContent = short + " 新增 " + NEW_COUNT + " 条";
    document.getElementById("updBox").style.display = "";
  }

  /* ---------- 视图切换：blur 交叉溶解 + 横向滑入 ---------- */
  var views = {
    cats:   document.getElementById("viewCats"),
    videos: document.getElementById("viewVideos"),
    teach:  document.getElementById("viewTeach")
  };
  var order = { cats: 0, videos: 1, teach: 2 };
  var current = "cats";
  var animating = false;
  var pill = document.getElementById("pill");
  var seg = document.getElementById("seg");
  var tabCats = document.getElementById("tabCats");
  var tabTeach = document.getElementById("tabTeach");

  function applyTheme(name) {
    if (name === "teach") document.body.setAttribute("data-theme", "warm");
    else document.body.removeAttribute("data-theme");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", name === "teach" ? "#FAF5EE" : "#F2F5F2");
  }

  function movePill() {
    var on = seg.querySelector("a.on");
    if (!on) return;
    pill.style.width = on.offsetWidth + "px";
    pill.style.transform = "translateX(" + (on.offsetLeft - pill.offsetLeft) + "px)";
  }

  function setTab(name) {
    var isTeach = name === "teach";
    tabCats.className = isTeach ? "" : "on";
    tabTeach.className = isTeach ? "on" : "";
    movePill();
  }

  function switchTo(name, opts) {
    if (name === current || animating) return;
    opts = opts || {};
    animating = true;
    var oldEl = views[current], newEl = views[name];
    var dir = order[name] > order[current] ? "right" : "left";

    setTab(name);
    // 颜色切换藏在旧页淡出+模糊的瞬间，视觉上不会硬跳
    applyTheme(name);
    oldEl.classList.add("leaving");

    setTimeout(function () {
      oldEl.className = "view";
      newEl.className = "view show in-" + dir;
      if (opts.after) opts.after();
      window.scrollTo(0, 0);
      lazyLoadPosters();
      setTimeout(function () {
        newEl.className = "view show";
        animating = false;
      }, 380);
    }, 145);
    current = name;
  }

  /* ---------- 分类页 ---------- */
  var catsBox = document.getElementById("cats");
  BATCHES.forEach(function (batch, bi) {
    var newCnt = 0;
    batch.items.forEach(function (it) { if (it.isNew) newCnt++; });

    var card = document.createElement("div");
    card.className = "cat glass";
    card.style.setProperty("--i", bi);

    var thumb = "";
    if (batch.items.length && batch.items[0].poster) {
      thumb = '<img class="cat-thumb" src="' + batch.items[0].poster + '" alt="" ' +
              'loading="lazy" onerror="this.style.visibility=\'hidden\'">';
    }

    card.innerHTML =
      thumb +
      '<div class="cat-main">' +
        '<div class="cat-title">' +
          "<h2>" + batch.label + "</h2>" +
          (batch.badge ? '<span class="cat-badge">' + batch.badge + "</span>" : "") +
          (newCnt > 0 ? '<span class="cat-new">新 ' + newCnt + "</span>" : "") +
        "</div>" +
        '<div class="cat-sub">共 <b>' + batch.count + "</b> 条" +
          (newCnt > 0 ? "，本轮新增 " + newCnt + " 条" : "") +
        "</div>" +
      "</div>" +
      '<span class="cat-go">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
      "</span>";

    card.addEventListener("click", function () {
      card.classList.remove("pressed");
      void card.offsetWidth;                 // 强制回流，让动画能重复触发
      card.classList.add("pressed");
      setTimeout(function () { card.classList.remove("pressed"); }, 560);
      // 让按压和高光被看见，再切页
      setTimeout(function () { openCategory(batch.slug); }, 165);
    });
    catsBox.appendChild(card);
  });

  /* ---------- 教学页：两列竖版网格，和对标页同一套形式 ---------- */
  var tgrid = document.getElementById("tgrid");
  TEACH.forEach(function (item, i) {
    var wrap = document.createElement("div");
    wrap.className = "cellwrap";

    var cell = document.createElement("div");
    cell.className = "cell tcell";
    cell.style.setProperty("--i", i);

    // 封面铺满，不受 video 的 object-fit 影响
    var poster = document.createElement("img");
    poster.className = "tposter";
    if (item.poster) poster.src = item.poster;
    poster.alt = "";
    poster.loading = "lazy";
    cell.appendChild(poster);

    // src 写在标签上：微信内置浏览器运行时赋 src 会静默失败
    var video = document.createElement("video");
    video.setAttribute("controlsList", "nodownload");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.setAttribute("x5-playsinline", "true");
    video.setAttribute("x5-video-player-type", "h5");
    video.setAttribute("x5-video-player-fullscreen", "true");
    video.setAttribute("preload", "none");
    video.setAttribute("src", item.src);
    cell.appendChild(video);

    var veil = document.createElement("div");
    veil.className = "veil";
    veil.innerHTML = '<span class="play"><svg viewBox="0 0 24 24"><path d="M7 4.2v15.6l13.2-7.8z"/></svg></span>';
    cell.appendChild(veil);

    var no = document.createElement("span");
    no.className = "tno-tag";
    no.textContent = (i + 1 < 10 ? "0" : "") + (i + 1);
    cell.appendChild(no);

    video.addEventListener("play", function () {
      cell.classList.add("on");
      poster.classList.add("hidden-img");
      veil.className = "veil off";
      // 同时只播一个
      var all = tgrid.querySelectorAll("video");
      for (var k = 0; k < all.length; k++) {
        if (all[k] !== video) all[k].pause();
      }
    });
    video.addEventListener("waiting", function () { cell.classList.add("busy"); });
    video.addEventListener("playing", function () {
      cell.classList.remove("busy");
      cell.classList.add("playing");
    });
    video.addEventListener("pause", function () {
      cell.classList.remove("busy", "playing");
    });
    video.addEventListener("error", function () {
      veil.className = "veil off";
      cell.classList.remove("busy", "playing");
    });

    veil.addEventListener("click", function () {
      // 揭封面必须放在点击里立刻做，不能依赖 play 事件：
      // 自动播放被拦、src 加载慢、X5 内核都可能不触发 play，
      // 那样遮罩消失了封面却还盖着，用户看到一张点不动的图。
      veil.className = "veil off";
      cell.classList.add("on");
      poster.classList.add("hidden-img");
      video.setAttribute("controls", "");
      var pr = video.play();
      if (pr && pr.catch) pr.catch(function () {});
    });

    wrap.appendChild(cell);

    var meta = document.createElement("div");
    meta.className = "tmeta";
    meta.innerHTML =
      '<div class="ttitle">' + item.title + "</div>" +
      '<div class="tmeta-foot">' +
        (item.duration ? '<span class="tdur-s">' + item.duration + "</span>" : "") +
      "</div>";
    wrap.appendChild(meta);

    tgrid.appendChild(wrap);
  });

  /* ---------- 封面懒加载 ---------- */
  var posterIO = null;
  function lazyLoadPosters() {
    if (posterIO) { posterIO.disconnect(); posterIO = null; }
    var vids = document.querySelectorAll("video[data-poster]");
    if (!vids.length) return;
    if (!("IntersectionObserver" in window)) {
      for (var i = 0; i < vids.length; i++) {
        vids[i].setAttribute("poster", vids[i].getAttribute("data-poster"));
        vids[i].removeAttribute("data-poster");
      }
      return;
    }
    posterIO = new IntersectionObserver(function (entries) {
      for (var j = 0; j < entries.length; j++) {
        if (!entries[j].isIntersecting) continue;
        var v = entries[j].target;
        posterIO.unobserve(v);
        var p = v.getAttribute("data-poster");
        if (p) { v.setAttribute("poster", p); v.removeAttribute("data-poster"); }
      }
    }, { root: null, rootMargin: "0px", threshold: 0.01 });
    for (var k = 0; k < vids.length; k++) posterIO.observe(vids[k]);
  }

  /* ---------- 视频列表页 ---------- */
  function openCategory(slug) {
    var batch = bySlug[slug];
    if (!batch) return;

    document.getElementById("secLabel").textContent = batch.label;
    var badge = document.getElementById("secBadge");
    if (batch.badge) { badge.textContent = batch.badge; badge.style.display = ""; }
    else { badge.style.display = "none"; }
    document.getElementById("secCnt").textContent = batch.count + " 条";

    var grid = document.getElementById("grid");
    grid.innerHTML = "";

    batch.items.forEach(function (item, idx) {
      var wrap = document.createElement("div");
      wrap.className = "cellwrap";

      var cell = document.createElement("div");
      cell.className = "cell";
      if (idx < 12) cell.style.setProperty("--i", idx);

      var veil = document.createElement("div");
      veil.className = "veil";
      veil.innerHTML = '<span class="play"><svg viewBox="0 0 24 24"><path d="M7 4.2v15.6l13.2-7.8z"/></svg></span>';

      var video = document.createElement("video");
      video.setAttribute("controlsList", "nodownload");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("x5-playsinline", "true");
      video.setAttribute("x5-video-player-type", "h5");
      video.setAttribute("x5-video-player-fullscreen", "true");
      video.setAttribute("preload", "none");
      // 首屏前 4 张直接挂封面：懒加载靠 IntersectionObserver，
      // 在缩放 iframe / 部分弱网场景会判定不到，导致首屏四块全黑。
      if (item.poster) {
        if (idx < 4) video.setAttribute("poster", item.poster);
        else video.setAttribute("data-poster", item.poster);
      }
      video.setAttribute("src", item.src);

      var spin = document.createElement("span");
      spin.className = "spin";
      cell.appendChild(spin);

      video.addEventListener("play", function () {
        cell.className = "cell busy";
        veil.className = "veil off";
        var all = document.querySelectorAll("video");
        for (var k = 0; k < all.length; k++) { if (all[k] !== video) all[k].pause(); }
      });
      video.addEventListener("waiting", function () { cell.className = "cell busy"; });
      video.addEventListener("playing", function () { cell.className = "cell playing"; });
      video.addEventListener("loadeddata", function () { if (!video.paused) cell.className = "cell playing"; });
      video.addEventListener("pause", function () { cell.className = "cell"; });
      video.addEventListener("error", function () { cell.className = "cell"; veil.className = "veil off"; });

      veil.addEventListener("click", function () {
        veil.className = "veil off";
        video.setAttribute("controls", "");
        var pr = video.play();
        if (pr && pr.catch) pr.catch(function () {});
      });

      cell.appendChild(video);
      cell.appendChild(veil);
      if (item.pinned) {
        // 置顶优先显示，不再叠一个「新」，避免两个角标抢位置
        var ptag = document.createElement("span");
        ptag.className = "new-tag pin-tag"; ptag.textContent = "置顶";
        cell.appendChild(ptag);
      } else if (item.isNew) {
        var tag = document.createElement("span");
        tag.className = "new-tag"; tag.textContent = "新";
        cell.appendChild(tag);
      }
      wrap.appendChild(cell);

      if (item.author) {
        var au = document.createElement("div");
        au.className = "author";
        var lb = document.createElement("span");
        lb.className = "lb"; lb.textContent = "抖音号";
        au.appendChild(lb);
        au.appendChild(document.createTextNode(item.author));
        wrap.appendChild(au);
      }
      grid.appendChild(wrap);
    });

    if (location.hash !== "#" + slug) {
      try { history.replaceState(null, "", "#" + slug); } catch (e) { location.hash = slug; }
    }
    switchTo("videos");
  }

  function showCats() {
    try { history.replaceState(null, "", location.pathname + location.search); }
    catch (e) { location.hash = ""; }
    switchTo("cats");
  }

  document.getElementById("backBtn").addEventListener("click", showCats);

  tabCats.addEventListener("click", function (e) {
    e.preventDefault();
    if (current === "videos") { showCats(); return; }
    if (current !== "cats") switchTo("cats");
  });
  tabTeach.addEventListener("click", function (e) {
    e.preventDefault();
    if (current !== "teach") switchTo("teach");
  });

  window.addEventListener("resize", movePill);
  movePill();

  /* 直接带 #slug 打开时进入对应分类；#teach 进教学页 */
  var initHash = location.hash.replace("#", "");
  if (initHash === "teach") {
    setTab("teach");
    views.cats.className = "view";
    views.teach.className = "view show";
    current = "teach";
    applyTheme("teach");
    movePill();
  } else if (initHash && bySlug[initHash]) {
    openCategory(initHash);
  }
})();
</script>
</body>
</html>
