<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>迷人秀对标视频</title>
<style>
  :root{
    --purple-deep:#4A1D8F;
    --purple:#7B2FF7;
    --purple-light:#A855F7;
    --ink:#1A1523;
    --bg:#F7F5FB;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 8px 32px}

  header{
    background:linear-gradient(135deg,var(--purple-deep) 0%,var(--purple) 55%,var(--purple-light) 100%);
    color:#fff;padding:18px 16px 16px;margin:0 -8px 4px;border-radius:0 0 20px 20px;
  }
  header h1{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
  header p{font-size:12px;opacity:.85}

  /* 两页切换标签 */
  .tabs{display:flex;gap:8px;padding:10px 4px 2px}
  .tab{
    flex:1;text-align:center;font-size:13px;font-weight:700;text-decoration:none;
    padding:9px 0;border-radius:10px;color:#7A7288;background:#EDE8F6;
  }
  .tab.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-light))}

  /* ---------- 分类选择页 ---------- */
  .cat-hint{font-size:12.5px;color:#8A8496;padding:12px 6px 10px}
  .cat{
    display:flex;align-items:center;gap:12px;
    background:#fff;border-radius:14px;padding:18px 14px;margin-bottom:10px;
    box-shadow:0 1px 4px rgba(74,29,143,.08);cursor:pointer;
  }
  .cat:active{transform:scale(.985)}
  .cat-icon{
    flex-shrink:0;width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--purple),var(--purple-light));
    color:#fff;font-size:17px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .cat-main{flex:1;min-width:0}
  .cat-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cat-title h2{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
  .cat-badge{
    font-size:10px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--purple-light));
    padding:2px 7px;border-radius:20px;letter-spacing:.3px;
  }
  .cat-new{
    font-size:10px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#FF2E4D 0%,#FF6A3D 100%);
    padding:2px 7px;border-radius:20px;letter-spacing:.3px;
  }
  .cat-sub{font-size:12px;color:#8A8496;margin-top:3px}
  .cat-arrow{flex-shrink:0;font-size:20px;color:#C9C2D8;font-weight:700}

  /* ---------- 分类内视频页 ---------- */
  .back{
    display:inline-flex;align-items:center;gap:4px;
    font-size:13.5px;font-weight:700;color:#7B2FF7;
    background:#EDE8F6;border:none;border-radius:10px;
    padding:9px 14px;margin:12px 4px 4px;cursor:pointer;
  }
  .sec{padding-top:10px}
  .sec-head{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
  .sec-head .bar{
    width:3px;height:14px;border-radius:2px;flex-shrink:0;
    background:linear-gradient(180deg,var(--purple),var(--purple-light));
  }
  .sec-head h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .sec-head .badge{
    font-size:10px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--purple-light));
    padding:2px 6px;border-radius:20px;letter-spacing:.3px;
  }
  .sec-head .cnt{margin-left:auto;font-size:11.5px;color:#7A7288}

  /* 两列：用 flex 而非 grid，兼容旧版微信 X5 内核 */
  .grid{
    display:-webkit-flex;
    display:flex;
    -webkit-flex-wrap:wrap;
    flex-wrap:wrap;
    margin:0 -4px;
  }
  .cellwrap{
    width:50%;
    padding:0 4px 8px;
  }

  /* 用 padding-bottom 撑比例，避免 aspect-ratio 在老内核失效导致高度为 0 */
  .cell{
    position:relative;
    width:100%;
    padding-bottom:177.78%;
    background:#000;
    border-radius:12px;
  }

  /* 圆角直接加在 video 上，父级不做 overflow 裁剪（规避 iOS 画面卡住的合成 bug） */
  video{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    display:block;
    background:#000;
    border-radius:12px;
    -o-object-fit:contain;
    object-fit:contain;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }

  footer{text-align:center;font-size:11px;color:#8A8496;margin-top:20px;opacity:.75}

  /* 「新」角标：左上角，不拦截点击，位置内缩避免被圆角切到 */
  .new-tag{
    position:absolute;top:6px;left:6px;z-index:2;
    display:inline-block;
    font-size:10px;font-weight:700;line-height:1;color:#fff;
    letter-spacing:.5px;
    padding:4px 5px;
    background:linear-gradient(135deg,#FF2E4D 0%,#FF6A3D 100%);
    border-radius:8px 8px 8px 2px;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
    pointer-events:none;
  }

  .updated{color:#FF4A2E;font-weight:700}

  .hidden{display:none !important}

  @media(min-width:700px){
    .wrap{padding:0 20px 40px}
    header{margin:0 -20px 4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>迷人秀对标视频</h1>
    <p>点视频上的播放键即可观看 · 共 <span id="total">0</span> 条<span id="newline"></span></p>
  </header>

  <nav class="tabs">
    <a class="tab active" href="index.html">对标视频</a>
    <a class="tab" href="teach.html">视频教学合集</a>
  </nav>

  <!-- 分类选择页 -->
  <div id="viewCats">
    <div class="cat-hint">先选想看的分类，点进去看视频</div>
    <div id="cats"></div>
  </div>

  <!-- 分类内视频页 -->
  <div id="viewVideos" class="hidden">
    <button class="back" id="backBtn">← 返回分类</button>
    <div class="sec">
      <div class="sec-head">
        <span class="bar"></span>
        <h2 id="secLabel"></h2>
        <span class="badge" id="secBadge"></span>
        <span class="cnt" id="secCnt"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <footer>内部对标素材，请勿外传</footer>
</div>

<script src="data.js"></script>
<script>
  var BATCHES = window.BATCHES || [];
  var total = 0;
  var bySlug = {};

  BATCHES.forEach(function (batch) {
    total += batch.count;
    bySlug[batch.slug] = batch;
  });
  document.getElementById("total").textContent = total;

  // 页头补充「本轮更新」信息
  var NEW_COUNT = window.NEW_COUNT || 0;
  if (NEW_COUNT > 0) {
    var d = window.UPDATED || "";
    var short = d.length === 10 ? d.slice(5) : d;
    document.getElementById("newline").innerHTML =
      " · " + short + " 更新，<span class=\"updated\">新增 " + NEW_COUNT + " 条</span>";
  }

  // ---------- 分类选择页 ----------
  var catsBox = document.getElementById("cats");
  BATCHES.forEach(function (batch, bi) {
    var newCnt = 0;
    batch.items.forEach(function (it) { if (it.isNew) newCnt++; });

    var card = document.createElement("div");
    card.className = "cat";
    card.innerHTML =
      '<div class="cat-icon">' + (bi + 1) + "</div>" +
      '<div class="cat-main">' +
        '<div class="cat-title">' +
          "<h2>" + batch.label + "</h2>" +
          (batch.badge ? '<span class="cat-badge">' + batch.badge + "</span>" : "") +
          (newCnt > 0 ? '<span class="cat-new">新 ' + newCnt + "</span>" : "") +
        "</div>" +
        '<div class="cat-sub">共 ' + batch.count + " 条视频" +
          (newCnt > 0 ? " · 本轮新增 " + newCnt + " 条" : "") +
        "</div>" +
      "</div>" +
      '<div class="cat-arrow">›</div>';

    card.addEventListener("click", function () {
      openCategory(batch.slug);
    });
    catsBox.appendChild(card);
  });

  // ---------- 分类内视频页 ----------
  function openCategory(slug) {
    var batch = bySlug[slug];
    if (!batch) return;

    document.getElementById("secLabel").textContent = batch.label;
    var badge = document.getElementById("secBadge");
    if (batch.badge) {
      badge.textContent = batch.badge;
      badge.style.display = "";
    } else {
      badge.style.display = "none";
    }
    document.getElementById("secCnt").textContent = batch.count + " 条";

    var grid = document.getElementById("grid");
    grid.innerHTML = "";

    batch.items.forEach(function (item) {
      var wrap = document.createElement("div");
      wrap.className = "cellwrap";

      var cell = document.createElement("div");
      cell.className = "cell";

      // src 直接写在标签上（微信内置浏览器运行时赋值会静默失败）
      // preload none：只加载封面，弱网更稳
      var video = document.createElement("video");
      video.setAttribute("controls", "");
      video.setAttribute("controlsList", "nodownload");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("x5-playsinline", "true");
      video.setAttribute("x5-video-player-type", "h5");
      video.setAttribute("x5-video-player-fullscreen", "true");
      video.setAttribute("preload", "none");
      video.setAttribute("poster", item.poster);
      video.setAttribute("src", item.src);

      video.addEventListener("play", function () {
        var all = document.querySelectorAll("video");
        for (var k = 0; k < all.length; k++) {
          if (all[k] !== video) all[k].pause();
        }
      });

      cell.appendChild(video);

      if (item.isNew) {
        var tag = document.createElement("span");
        tag.className = "new-tag";
        tag.textContent = "新";
        cell.appendChild(tag);
      }

      wrap.appendChild(cell);
      grid.appendChild(wrap);
    });

    document.getElementById("viewCats").className = "hidden";
    document.getElementById("viewVideos").className = "";
    window.scrollTo(0, 0);
    if (location.hash !== "#" + slug) location.hash = slug;
  }

  function showCats() {
    document.getElementById("viewVideos").className = "hidden";
    document.getElementById("viewCats").className = "";
    if (location.hash) location.hash = "";
    window.scrollTo(0, 0);
  }

  document.getElementById("backBtn").addEventListener("click", showCats);

  // 直接带 #slug 打开时进入对应分类（刷新/分享不丢位置）
  var initHash = location.hash.replace("#", "");
  if (initHash && bySlug[initHash]) {
    openCategory(initHash);
  }
</script>
</body>
</html>
