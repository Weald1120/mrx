<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>迷人秀对标视频</title>
<style>
  :root{
    --purple-deep:#4A1D8F;
    --purple:#7B2FF7;
    --purple-light:#A855F7;
    --ink:#1A1523;
    --bg:#F7F5FB;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 8px 32px}

  header{
    background:linear-gradient(135deg,var(--purple-deep) 0%,var(--purple) 55%,var(--purple-light) 100%);
    color:#fff;padding:18px 16px 16px;margin:0 -8px 4px;border-radius:0 0 20px 20px;
  }
  header h1{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
  header p{font-size:12px;opacity:.85}

  .sec{padding-top:14px}
  .sec-head{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
  .sec-head .bar{
    width:3px;height:14px;border-radius:2px;flex-shrink:0;
    background:linear-gradient(180deg,var(--purple),var(--purple-light));
  }
  .sec-head h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .sec-head .badge{
    font-size:10px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--purple),var(--purple-light));
    padding:2px 6px;border-radius:20px;letter-spacing:.3px;
  }
  .sec-head .cnt{margin-left:auto;font-size:11.5px;color:#7A7288}

  /* 两列：用 flex 而非 grid，兼容旧版微信 X5 内核 */
  .grid{
    display:-webkit-flex;
    display:flex;
    -webkit-flex-wrap:wrap;
    flex-wrap:wrap;
    margin:0 -4px;
  }
  .cellwrap{
    width:50%;
    padding:0 4px 8px;
  }

  /* 用 padding-bottom 撑比例，避免 aspect-ratio 在老内核失效导致高度为 0 */
  .cell{
    position:relative;
    width:100%;
    padding-bottom:177.78%;
    background:#000;
    border-radius:12px;
  }

  /* 圆角直接加在 video 上，父级不做 overflow 裁剪（规避 iOS 画面卡住的合成 bug） */
  video{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    display:block;
    background:#000;
    border-radius:12px;
    -o-object-fit:contain;
    object-fit:contain;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }

  footer{text-align:center;font-size:11px;color:#8A8496;margin-top:20px;opacity:.75}

  @media(min-width:700px){
    .wrap{padding:0 20px 40px}
    header{margin:0 -20px 4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>迷人秀对标视频</h1>
    <p>点视频上的播放键即可观看 · 共 <span id="total">0</span> 条</p>
  </header>

  <div id="sections"></div>

  <footer>内部对标素材，请勿外传</footer>
</div>

<script src="data.js"></script>
<script>
  var sections = document.getElementById("sections");
  var BATCHES = window.BATCHES || [];
  var total = 0;

  BATCHES.forEach(function (batch, bi) {
    total += batch.count;

    var sec = document.createElement("section");
    sec.className = "sec";

    var head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML =
      '<span class="bar"></span>' +
      "<h2>" + batch.label + "</h2>" +
      (batch.badge ? '<span class="badge">' + batch.badge + "</span>" : "") +
      '<span class="cnt">' + batch.count + " 条</span>";
    sec.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "grid";
    sec.appendChild(grid);

    batch.items.forEach(function (item) {
      var wrap = document.createElement("div");
      wrap.className = "cellwrap";

      var cell = document.createElement("div");
      cell.className = "cell";

      // 关键修复：src 直接写在标签上，不在点击时才赋值
      // 微信内置浏览器里"运行时赋值 + 立即 play()"会静默失败
      // preload 用 none：首屏不预载 9 个视频，只加载封面，弱网下更稳
      var video = document.createElement("video");
      video.setAttribute("controls", "");
      video.setAttribute("controlsList", "nodownload");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("x5-playsinline", "true");
      video.setAttribute("x5-video-player-type", "h5");
      video.setAttribute("x5-video-player-fullscreen", "true");
      video.setAttribute("preload", "none");
      video.setAttribute("poster", item.poster);
      video.setAttribute("src", item.src);

      // 一条播放时暂停其它，只调用 pause()，不主动 play()，避免被拦截
      video.addEventListener("play", function () {
        var all = document.querySelectorAll("video");
        for (var k = 0; k < all.length; k++) {
          if (all[k] !== video) all[k].pause();
        }
      });

      cell.appendChild(video);
      wrap.appendChild(cell);
      grid.appendChild(wrap);
    });

    sections.appendChild(sec);
  });

  document.getElementById("total").textContent = total;
</script>
</body>
</html>
